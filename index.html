<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lol-max</title>
    <!-- Light mode remembered from last time: set it before anything is drawn, so there's no
         flash of dark first. Dark (no attribute) is the default. See src/ui/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("lol-max-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>
  <body>
    <!-- The parts every page shares. The page itself is drawn into #page by src/main.ts. -->
    <header class="topbar">
      <a class="brand" href="/">lol-max</a>
      <div id="topbar-search" class="topbar-search"></div>
      <nav class="topbar-links">
        <a href="/about">How it works</a>
        <button id="theme-toggle" type="button" class="theme-toggle"></button>
      </nav>
    </header>

    <main id="page"></main>

    <footer class="site-footer">
      lol-max is a fan project, not made or endorsed by Riot Games. League of Legends and its icons are
      trademarks of Riot Games, Inc.
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
